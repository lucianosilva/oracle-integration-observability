- # ====== Dynamic Action: Validate Custom Range ===============
  id: 17888633950271099
  identification: 
    name: Validate Custom Range

  execution: 
    sequence: 40
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Item(s)
    item(s): 
    - P4_DATE_FROM
    - P4_DATE_TO
    - P4_PERIOD

  client-side-condition: 
    type: Item = Value
    item: P4_PERIOD
    value: RANGE

  actions: 
  - # ====== Action: Validate and Refresh Range ==================
    id: 17889092991271100
    identification: 
      name: Validate and Refresh Range
      action: Execute JavaScript Code

    settings: 
      code: |
        apex.message.clearErrors();
        
        const fromValue = apex.item("P4_DATE_FROM").getValue();
        const toValue   = apex.item("P4_DATE_TO").getValue();
        
        if (!fromValue || !toValue) {
            return;
        }
        
        const fromDate = apex.date.parse(fromValue, "DD/MM/YYYY");
        const toDate   = apex.date.parse(toValue, "DD/MM/YYYY");
        
        if (toDate < fromDate) {
            apex.message.showErrors([{
                type: "error",
                location: ["inline"],
                pageItem: "P4_DATE_TO",
                message: "To date must be greater than or equal to From date.",
                unsafe: false
            }]);
            return;
        }
        
        const millisecondsPerDay = 86400000;
        
        const days =
            Math.floor((toDate - fromDate) / millisecondsPerDay) + 1;
        
        if (days > 90) {
            apex.message.showErrors([{
                type: "error",
                location: ["inline"],
                pageItem: "P4_DATE_TO",
                message: "The custom date range cannot exceed 90 days.",
                unsafe: false
            }]);
            return;
        }
        
        apex.region("Dashboard_KPIs").refresh();
        apex.region("Dashboard_Donuts").refresh();
        apex.region("Transaction_Volume").refresh();
        apex.region("Top_Integrations").refresh();

    execution: 
      sequence: 10
      event: Validate Custom Range # 17888633950271099
      fire-when-event-result-is: True
      fire-on-initialization: false

