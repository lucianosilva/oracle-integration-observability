- # ====== Region: PayloadContext ==============================
  id: 17086981972380907
  identification: 
    name: PayloadContext
    type: Content Row

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select
          p.transaction_id1 as title,
      
          'Integration: ' || p.integration_key as description,
      
          'Event: ' || p.event_type
              || '  •  Step: ' || p.step_name
              || '  •  Level: '
              || case h.log_level
                   when 'I' then 'Info'
                   when 'E' then 'Error'
                   else h.log_level
                 end as misc,
      
          p.transaction_status as badge_value,
      
          case p.transaction_status
              when 'COMPLETED'   then 'success'
              when 'FAILED'      then 'danger'
              when 'IN_PROGRESS' then 'warning'
              when 'RECEIVED'    then 'info'
              else 'normal'
          end as badge_state
      
      from oio_owner.oio_v_trace_payload p
      
      join oio_owner.oio_v_trace_status_history h
        on h.trace_detail_id = p.trace_detail_id
      
      where p.trace_lob_id = :P3_TRACE_LOB_ID

  order-by: 
    type: None

  layout: 
    sequence: 10
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Blank with Attributes (No Grid)
    template-options: 
    - '#DEFAULT#'
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Region

  advanced: 
    region-display-selector: false
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    appearance: 
      display: Multiple (Report)

    settings: 
      title: '&TITLE.'
      description: '&DESCRIPTION.'
      miscellaneous: '&MISC.'
      display-avatar: false
      display-badge: true

    badge: 
      label: '&BADGE_STATE.'
      value: BADGE_VALUE
      state: BADGE_STATE
      display-label: false
      style: Default
      shape: Default
      size: Default
      column-width: Medium
      position: START
      alignment: START

    appearance: 
      apply-theme-colors: true
      style: Default
      hide-borders: false
      remove-padding: false

    row-selection: 
      type: None

    performance: 
      lazy-loading: false

    pagination: 
      type: Page
      entities-per-page: 15
      show-total-count: false

