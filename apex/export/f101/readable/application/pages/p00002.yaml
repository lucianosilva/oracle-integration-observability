- # ====== Region: Event History ===============================
  id: 15907823231777702
  identification: 
    name: Event History
    title: 'Event History '
    type: Classic Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      select
          h.trace_detail_id,
          h.transaction_id1,
          h.event_timestamp,
          h.event_type,
          h.step_name,
      
          h.history_status,
      
          case h.history_status
              when 'COMPLETED'   then 'Completed'
              when 'FAILED'      then 'Failed'
              when 'IN_PROGRESS' then 'In Progress'
              when 'RECEIVED'    then 'Received'
              else initcap(replace(h.history_status, '_', ' '))
          end as status_display,
      
          case h.history_status
              when 'COMPLETED'   then 'success'
              when 'FAILED'      then 'danger'
              when 'IN_PROGRESS' then 'warning'
              when 'RECEIVED'    then 'info'
              else 'normal'
          end as status_badge_state,
      
          h.log_level,
      
          case h.log_level
              when 'I' then 'Info'
              when 'E' then 'Error'
              else h.log_level
          end as level_display,
      
          case h.log_level
              when 'I' then 'info'
              when 'E' then 'danger'
              else 'normal'
          end as level_badge_state,
      
          h.oic_instance_id,
          h.user_name,
          h.summary,
          h.error_code,
          h.error_message,
      
          (
              select max(p.trace_lob_id)
                     keep (
                         dense_rank last
                         order by p.payload_creation_date
                     )
              from oio_owner.oio_v_trace_payload p
              where p.trace_detail_id = h.trace_detail_id
          ) as trace_lob_id,
      
          case
              when exists (
                  select 1
                  from oio_owner.oio_v_trace_payload p
                  where p.trace_detail_id = h.trace_detail_id
              )
              then 'View Payload'
          end as payload_action
      
      from oio_owner.oio_v_trace_status_history h
      where h.trace_id = :P2_TRACE_ID
      order by
          h.event_timestamp desc,
          h.trace_detail_id desc
    page-items-to-submit: 
    - P2_TRACE_ID
    - P2_TRANSACTION_ID

  order-by: 
    type: None

  layout: 
    sequence: 50
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

