- # ====== Dynamic Action: Validate Custom Range ===============
  id: 15911689855777740
  identification: 
    name: Validate Custom Range

  execution: 
    sequence: 50
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Item(s)
    item(s): 
    - P2_DATE_FROM
    - P2_DATE_TO

  client-side-condition: 
    type: Item = Value
    item: P2_PERIOD
    value: RANGE

  actions: 
  - # ====== Action: Validate and Refresh Range ==================
    id: 15911738331777741
    identification: 
      name: Validate and Refresh Range
      action: Execute JavaScript Code

    settings: 
      code: |
        apex.message.clearErrors();
        
        const fromValue = apex.item("P2_DATE_FROM").getValue();
        const toValue   = apex.item("P2_DATE_TO").getValue();
        
        if (!fromValue || !toValue) {
            return;
        }
        
        const fromDate = apex.date.parse(fromValue, "DD/MM/YYYY");
        const toDate   = apex.date.parse(toValue, "DD/MM/YYYY");
        
        if (toDate < fromDate) {
            apex.message.showErrors([{
                type: "error",
                location: ["inline"],
                pageItem: "P2_DATE_TO",
                message: "To date must be greater than or equal to From date.",
                unsafe: false
            }]);
            return;
        }
        
        const millisecondsPerDay = 86400000;
        
        const days =
            Math.floor((toDate - fromDate) / millisecondsPerDay) + 1;
        
        if (days > 90) {
            apex.message.showErrors([{
                type: "error",
                location: ["inline"],
                pageItem: "P2_DATE_TO",
                message: "The custom date range cannot exceed 90 days.",
                unsafe: false
            }]);
            return;
        }
        
        apex.item("P2_TRACE_ID").setValue("");
        apex.item("P2_TRANSACTION_ID").setValue("");
        
        apex.region("event_history").refresh();
        apex.region("transactions").refresh();

    execution: 
      sequence: 10
      event: Validate Custom Range # 15911689855777740
      fire-when-event-result-is: True
      fire-on-initialization: false

