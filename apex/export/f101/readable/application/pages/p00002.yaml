- # ====== Region: Transactions ================================
  id: 15892641671683399
  identification: 
    name: Transactions
    title: Transactions Search
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      with period_filter as (
          select
              case :P2_PERIOD
      
                  when 'H1' then
                      cast(
                          systimestamp - interval '1' hour
                          as timestamp
                      )
      
                  when 'H6' then
                      cast(
                          systimestamp - interval '6' hour
                          as timestamp
                      )
      
                  when 'H24' then
                      cast(
                          systimestamp - interval '24' hour
                          as timestamp
                      )
      
                  when 'D7' then
                      cast(
                          systimestamp - interval '7' day
                          as timestamp
                      )
      
                  when 'D30' then
                      cast(
                          systimestamp - interval '30' day
                          as timestamp
                      )
      
                  when 'RANGE' then
                      apex_session_state.get_timestamp(
                          'P2_DATE_FROM'
                      )
      
              end as date_from,
      
              case
                  when :P2_PERIOD = 'RANGE' then
                      apex_session_state.get_timestamp(
                          'P2_DATE_TO'
                      ) + interval '1' day
      
                  else
                      cast(
                          systimestamp + interval '1' second
                          as timestamp
                      )
              end as date_to
      
          from dual
      )
      select
          v.trace_id,
          v.creation_date,
          v.integration_key,
          v.integration_description,
          v.source_system,
          v.target_system,
          v.outcome,
          v.current_status,
          v.transaction_id1,
          v.log_ref_id,
          v.oic_instance_id,
          v.summary,
          v.error_code,
          v.last_update_date,
          case v.outcome
          when 'SUCCESS' then 'success'
          when 'ERROR'   then 'danger'
          else 'normal'
      end as outcome_badge_state,
      case v.current_status
          when 'COMPLETED'   then 'success'
          when 'FAILED'      then 'danger'
          when 'IN_PROGRESS' then 'warning'
          when 'RECEIVED'    then 'info'
          else 'normal'
      end as status_badge_state
      from oio_owner.oio_v_trace_current v
      cross join period_filter p
      where v.creation_date >= p.date_from
        and v.creation_date <  p.date_to
      
        and (
              :P2_INTEGRATION_KEY is null
              or v.integration_key = :P2_INTEGRATION_KEY
            )
      
        and (
              :P2_OUTCOME is null
              or v.outcome = :P2_OUTCOME
            )
      
        and (
              :P2_STATUS is null
              or v.current_status = :P2_STATUS
            )
      
        and (
              :P2_SOURCE_SYSTEM is null
              or v.source_system = :P2_SOURCE_SYSTEM
            )
      
        and (
              :P2_TARGET_SYSTEM is null
              or v.target_system = :P2_TARGET_SYSTEM
            )
      
      order by v.creation_date desc
    page-items-to-submit: 
    - P2_PERIOD
    - P2_INTEGRATION_KEY
    - P2_OUTCOME
    - P2_STATUS
    - P2_SOURCE_SYSTEM
    - P2_TARGET_SYSTEM
    - P2_DATE_FROM
    - P2_DATE_TO

