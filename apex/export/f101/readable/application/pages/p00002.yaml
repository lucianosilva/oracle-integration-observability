dynamic-actions: 
- # ====== Dynamic Action: Scroll to Event History =============
  id: 15909080238777714
  identification: 
    name: Scroll to Event History

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: After Refresh
    selection-type: Region
    region: Event History # 15907823231777702

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 15909197577777715
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        const traceId =
            apex.item("P2_TRACE_ID").getValue();
        
        const transactionId =
            apex.item("P2_TRANSACTION_ID").getValue();
        
        if (!traceId) {
            return;
        }
        
        const title =
            document.querySelector(
                "#selected_transaction .t-Region-title"
            );
        
        if (title) {
            title.textContent =
                "Transaction: " + transactionId;
        }
        
        const eventHistory =
            document.getElementById("event_history");
        
        if (eventHistory) {
            eventHistory.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        }

    execution: 
      sequence: 10
      event: Scroll to Event History # 15909080238777714
      fire-when-event-result-is: True
      fire-on-initialization: false

- # ====== Dynamic Action: Toggle Selected Transaction =========
  id: 15909502149777719
  identification: 
    name: Toggle Selected Transaction

  execution: 
    sequence: 20
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Item(s)
